apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
    name: jirello-gateway
spec:
    gatewayClassName: nginx
    listeners:
        - name: http
          hostname: api.jirello.example.com
          port: 80
          protocol: HTTP
          allowedRoutes:
              namespaces:
                  from: Same
        - name: https
          hostname: api.jirello.example.com
          port: 443
          protocol: HTTPS
          tls:
              mode: Terminate
              certificateRefs:
                  - kind: Secret
                    name: jirello-api-tls
          allowedRoutes:
              namespaces:
                  from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: jirello-api-http-redirect
spec:
    parentRefs:
        - name: jirello-gateway
          sectionName: http
    hostnames:
        - api.jirello.example.com
    rules:
        - filters:
              - type: RequestRedirect
                requestRedirect:
                    scheme: https
                    statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: jirello-api
spec:
    parentRefs:
        - name: jirello-gateway
          sectionName: https
    hostnames:
        - api.jirello.example.com
    rules:
        - backendRefs:
              - name: jirello-api
                port: 80
