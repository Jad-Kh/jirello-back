apiVersion: apps/v1
kind: Deployment
metadata:
    name: jirello-api
spec:
    replicas: 3
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: jirello-back
            app.kubernetes.io/component: api
    template:
        metadata:
            labels:
                app.kubernetes.io/name: jirello-back
                app.kubernetes.io/component: api
        spec:
            serviceAccountName: jirello-back
            terminationGracePeriodSeconds: 30
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                      matchLabels:
                          app.kubernetes.io/name: jirello-back
                          app.kubernetes.io/component: api
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                      matchLabels:
                          app.kubernetes.io/name: jirello-back
                          app.kubernetes.io/component: api
            containers:
                - name: api
                  image: jirello-back:latest
                  imagePullPolicy: IfNotPresent
                  envFrom:
                      - configMapRef:
                            name: jirello-config
                      - secretRef:
                            name: jirello-secrets
                  env:
                      - name: PROCESS_ROLE
                        value: api
                      - name: INSTANCE_ID
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.name
                  ports:
                      - name: http
                        containerPort: 8082
                  startupProbe:
                      httpGet:
                          path: /health/ready
                          port: http
                      periodSeconds: 5
                      failureThreshold: 24
                  readinessProbe:
                      httpGet:
                          path: /health/ready
                          port: http
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 2
                  livenessProbe:
                      httpGet:
                          path: /health/live
                          port: http
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 3
                  lifecycle:
                      preStop:
                          exec:
                              command: ["sh", "-c", "sleep 5"]
                  resources:
                      requests:
                          cpu: 200m
                          memory: 256Mi
                      limits:
                          cpu: "1"
                          memory: 768Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: ["ALL"]
                      readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
    name: jirello-api
    labels:
        monitoring: jirello
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: jirello-back
        app.kubernetes.io/component: api
    ports:
        - name: http
          port: 80
          targetPort: http
