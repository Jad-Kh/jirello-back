apiVersion: v1
kind: Secret
metadata:
    name: jirello-secrets
    namespace: jirello
type: Opaque
stringData:
    # Use managed, multi-zone MongoDB and Redis endpoints in production.
    MONGO_CONNECT_URI: mongodb+srv://user:password@cluster.example/jirello
    REDIS_URL: rediss://default:password@redis.example:6379
    JWT_ACCESS_SECRET: replace-with-an-independent-random-secret
    JWT_REFRESH_SECRET: replace-with-another-independent-random-secret
    JWT_SECRET: replace-with-a-fallback-random-secret
    METRICS_TOKEN: replace-with-at-least-thirty-two-random-characters
    SMTP_HOST: smtp.example.com
    SMTP_PORT: "587"
    SMTP_SECURE: "false"
    SMTP_USER: smtp-user
    SMTP_PASSWORD: smtp-password
    SMTP_FROM: no-reply@example.com
    PUSHER_APP_ID: pusher-app-id
    PUSHER_KEY: pusher-key
    PUSHER_SECRET: pusher-secret
    PUSHER_CLUSTER: eu
